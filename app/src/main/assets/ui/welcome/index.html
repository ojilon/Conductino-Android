<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="style.css" />
  <title>Conductino</title>
</head>
<body>
  <main class="welcome">
    <header class="hero">
      <div class="brand">Conductino</div>
      <p class="tagline">Study-focused browser</p>
    </header>

    <!-- Local search bar; submits through the same Aurora bridge the native omnibox uses -->
    <form id="omni" class="omnibox" autocomplete="off">
      <span class="glyph" aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="Search or type a URL" autofocus enterkeyhint="go" />
    </form>

    <section class="section">
      <h2 class="section-title">Quick access</h2>
      <nav class="shortcuts" id="shortcuts" aria-label="Shortcuts"></nav>
    </section>

    <section class="section muted-block">
      <p class="hint">Use the top bar for navigation. Open the side menu for History, Downloads and Settings.</p>
    </section>

    <button type="button" class="ghost" id="dev">Developer tools</button>
  </main>

  <script src="../shared/aurora-api.js"></script>
  <script src="logic.js"></script>
</body>
</html>
