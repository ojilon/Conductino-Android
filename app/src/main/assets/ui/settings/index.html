<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <style>
    .wrap { padding: 20px; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
         color: var(--muted); margin: 20px 0 10px; font-weight: 600; }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 8px;
    }
    .engines, .themes { display: flex; flex-direction: column; gap: 8px; }
    .pick {
      text-align: left; padding: 14px 16px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--bg-elev); color: var(--fg);
      font-size: 15px; cursor: pointer;
    }
    .pick.active { border-color: var(--accent); color: var(--accent); }
    .hint { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Settings</h1>

    <h2>Search engine</h2>
    <div class="engines" id="engines">
      <button type="button" class="pick" data-engine="duckduckgo">DuckDuckGo</button>
      <button type="button" class="pick" data-engine="google">Google</button>
      <button type="button" class="pick" data-engine="brave">Brave Search</button>
    </div>

    <h2>Theme</h2>
    <div class="themes" id="themes">
      <button type="button" class="pick" data-theme="aurora-dark">Aurora Dark</button>
      <button type="button" class="pick" data-theme="aurora-dim">Aurora Dim</button>
    </div>
    <p class="hint">Theme is saved on device. HTML surfaces can read the choice via payload; native chrome uses the dark palette.</p>

    <h2>General</h2>
    <div class="row"><span>HTTPS only</span><b>On</b></div>
    <div class="row"><span>Max results</span><b id="max">300</b></div>
  </div>
  <script src="../shared/aurora-api.js"></script>
  <script>
    Aurora.ready('settings');

    function mark(sel, attr, id) {
      document.querySelectorAll(sel).forEach((b) => {
        b.classList.toggle('active', b.getAttribute(attr) === id);
      });
    }

    document.querySelectorAll('[data-engine]').forEach((b) => {
      b.addEventListener('click', () => {
        const id = b.getAttribute('data-engine');
        Aurora.selectEngine(id);
        mark('[data-engine]', 'data-engine', id);
      });
    });

    document.querySelectorAll('[data-theme]').forEach((b) => {
      b.addEventListener('click', () => {
        const id = b.getAttribute('data-theme');
        Aurora.setTheme(id);
        mark('[data-theme]', 'data-theme', id);
        document.documentElement.setAttribute('data-theme', id);
      });
    });

    Aurora.on('payload', (d) => {
      if (d && d.engine) mark('[data-engine]', 'data-engine', d.engine);
      if (d && d.theme) {
        mark('[data-theme]', 'data-theme', d.theme);
        document.documentElement.setAttribute('data-theme', d.theme);
      }
      if (d && d.maxResults) document.getElementById('max').textContent = d.maxResults;
    });

    mark('[data-engine]', 'data-engine', 'duckduckgo');
    mark('[data-theme]', 'data-theme', 'aurora-dark');
  </script>
</body>
</html>
