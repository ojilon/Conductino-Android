<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <style>
    .wrap { padding: 20px; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
         color: var(--muted); margin: 20px 0 10px; font-weight: 600; }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; background: var(--bg-elev); border: 1px solid #26305a;
      border-radius: 12px; margin-bottom: 8px;
    }
    .engines { display: flex; flex-direction: column; gap: 8px; }
    .engine-btn {
      text-align: left; padding: 14px 16px; border-radius: 12px;
      border: 1px solid #26305a; background: var(--bg-elev); color: var(--fg);
      font-size: 15px; cursor: pointer;
    }
    .engine-btn.active {
      border-color: var(--accent); color: var(--accent);
    }
    .hint { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Settings</h1>

    <h2>Search engine</h2>
    <div class="engines" id="engines">
      <!-- filled by logic; defaults mirror search_engines.json -->
      <button type="button" class="engine-btn" data-id="duckduckgo">DuckDuckGo</button>
      <button type="button" class="engine-btn" data-id="google">Google</button>
      <button type="button" class="engine-btn" data-id="brave">Brave Search</button>
    </div>
    <p class="hint">Choice is saved on device. Omnibox and the welcome search both use this engine.</p>

    <h2>General</h2>
    <div class="row"><span>HTTPS only</span><b>On</b></div>
    <div class="row"><span>Max results</span><b id="max">300</b></div>
  </div>
  <script src="../shared/aurora-api.js"></script>
  <script>
    Aurora.ready('settings');

    const buttons = document.querySelectorAll('.engine-btn');
    function mark(id) {
      buttons.forEach((b) => {
        b.classList.toggle('active', b.getAttribute('data-id') === id);
      });
    }

    buttons.forEach((b) => {
      b.addEventListener('click', () => {
        const id = b.getAttribute('data-id');
        Aurora.selectEngine(id);
        mark(id);
      });
    });

    Aurora.on('payload', (d) => {
      if (d && d.engine) mark(d.engine);
      if (d && d.maxResults) document.getElementById('max').textContent = d.maxResults;
    });

    // Default highlight until payload arrives
    mark('duckduckgo');
  </script>
</body>
</html>
