// ─────────────────────────────────────────────────────────────
// :app module — Android application + JNI bridge to backend/
// ─────────────────────────────────────────────────────────────
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.conductino.study'
    compileSdk 36

    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId 'com.conductino.study'
        minSdk 26
        targetSdk 34

        versionCode project.property("app.versionCode").toInteger()
        versionName project.property("app.versionName")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            def abiProperty = project.findProperty("aurora.abiFilters") as String
            if (abiProperty != null) {
                abiFilters.addAll(abiProperty.split(",").collect { it.trim() })
            }
        }

        externalNativeBuild {
            cmake {
                // C11 for existing sources; switch to c++23 when first .cpp lands
                cppFlags "-std=c11"
                arguments "-DANDROID_STL=c++_shared"
                // Enable native build only when third_party is present:
                // arguments "-DBUILD_AURORA_CORE=ON", "-DANDROID_STL=c++_shared"
            }
        }
    }

    // Native backend lives at repo root (not under app/)
    externalNativeBuild {
        cmake {
            path file("../backend/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'db', 'wasm'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
        animationsDisabled = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
